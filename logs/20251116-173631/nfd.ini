[general]
# (str) best-route / asf / multicast 
strategy = best-route
# (str) tcp / udp / ether
protocol = tcp
# (str) none / warn / info / debug / trace
logLevel = debug
# (bool) cli
cli = false

[cache]
# (int) capacity of cached segments
csSize = 512
# (str) Not Support, default lru
csPolicy = 
# (str) Not Support, default drop-all
csUnsolicitedPolicy = 

[suppression] # (int) miliseconds
# default: 10
retx-suppression-inital =
# default: 250
retx-suppression-max =
# default: 2
retx-suppression-multiplier =

